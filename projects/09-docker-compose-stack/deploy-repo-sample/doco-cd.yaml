# doco-cd GitOps Configuration Sample
version: "1"

git:
    repository: "https://github.com/thesr/Full_Stack_Prep.git"
    branch: "main"
    poll_interval: 30s
    path: "projects/09-docker-compose-stack/docker-compose.yml"

docker:
    compose_file: "docker-compose.yml"
    env_file: ".env"
    auto_pull: true
    remove_orphans: true

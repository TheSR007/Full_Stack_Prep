global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']

  - job_name: 'api-gateway'
    static_configs:
      - targets: ['api-gateway:8080']

  - job_name: 'api-go-user'
    static_configs:
      - targets: ['api-go-user:8081']

  - job_name: 'api-fastapi-worker'
    static_configs:
      - targets: ['api-fastapi-worker:8000']

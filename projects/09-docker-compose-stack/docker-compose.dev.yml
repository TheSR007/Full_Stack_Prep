volumes:
  prometheus_data:
  grafana_data:

services:
  nginx:
    build:
      context: ./nginx
      dockerfile: Dockerfile
    container_name: devops-nginx-dev
    restart: unless-stopped
    ports:
      - "${NGINX_PORT}:80"
    depends_on:
      frontend-nextjs:
        condition: service_healthy
      api-gateway:
        condition: service_healthy
      prometheus:
        condition: service_started

  frontend-nextjs:
    build:
      context: ./frontend-nextjs
      dockerfile: Dockerfile
      target: development
    container_name: devops-frontend-nextjs-dev
    restart: unless-stopped
    ports:
      - "${FRONTEND_PORT}:3000"
    volumes:
      - ./frontend-nextjs:/app:ro
      - /app/node_modules
      - /app/.next
    environment:
      NODE_ENV: development
      PORT: ${FRONTEND_PORT}
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL}
      WATCHPACK_POLLING: "true"
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://127.0.0.1:3000/"]
      interval: 10s
      timeout: 5s
      retries: 5

  api-gateway:
    build:
      context: ./api-gateway
      dockerfile: Dockerfile
      target: development
    container_name: devops-api-gateway-dev
    restart: unless-stopped
    ports:
      - "${GATEWAY_PORT}:8080"
    volumes:
      - ./api-gateway:/app:ro
    environment:
      GATEWAY_PORT: ${GATEWAY_PORT}
      USER_SERVICE_HOST: http://api-go-user:${USER_SERVICE_PORT}
      WORKER_SERVICE_HOST: http://api-fastapi-worker:${WORKER_SERVICE_PORT}
    depends_on:
      api-go-user:
        condition: service_healthy
      api-fastapi-worker:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://127.0.0.1:8080/healthz"]
      interval: 10s
      timeout: 5s
      retries: 5

  api-go-user:
    build:
      context: ./api-go-user
      dockerfile: Dockerfile
      target: development
    container_name: devops-api-go-user-dev
    restart: unless-stopped
    ports:
      - "${USER_SERVICE_PORT}:8081"
    volumes:
      - ./api-go-user:/app:ro
    environment:
      USER_SERVICE_PORT: ${USER_SERVICE_PORT}
      POSTGRES_HOST: ${POSTGRES_HOST}
      POSTGRES_PORT: ${POSTGRES_PORT}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
      REDIS_HOST: ${REDIS_HOST}
      REDIS_PORT: ${REDIS_PORT}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://127.0.0.1:8081/healthz"]
      interval: 10s
      timeout: 5s
      retries: 5

  api-fastapi-worker:
    build:
      context: ./api-fastapi-worker
      dockerfile: Dockerfile
      target: development
    container_name: devops-api-fastapi-worker-dev
    restart: unless-stopped
    ports:
      - "${WORKER_SERVICE_PORT}:8000"
    volumes:
      - ./api-fastapi-worker:/app:ro
    environment:
      WORKER_SERVICE_PORT: ${WORKER_SERVICE_PORT}
      MONGO_HOST: ${MONGO_HOST}
      MONGO_PORT: ${MONGO_PORT}
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_INITDB_ROOT_USERNAME}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_INITDB_ROOT_PASSWORD}
      MONGO_DB: ${MONGO_DB}
      REDIS_HOST: ${REDIS_HOST}
      REDIS_PORT: ${REDIS_PORT}
    depends_on:
      mongo:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/healthz')"]
      interval: 10s
      timeout: 5s
      retries: 5

  postgres:
    image: postgres:16-alpine
    container_name: devops-postgres-dev
    restart: unless-stopped
    ports:
      - "${POSTGRES_PORT}:5432"
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 5

  mongo:
    image: mongo:7-jammy
    container_name: devops-mongo-dev
    restart: unless-stopped
    ports:
      - "${MONGO_PORT}:27017"
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_INITDB_ROOT_USERNAME}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_INITDB_ROOT_PASSWORD}
      MONGO_INITDB_DATABASE: ${MONGO_DB}
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 5s
      timeout: 3s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: devops-redis-dev
    restart: unless-stopped
    ports:
      - "${REDIS_PORT}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  prometheus:
    image: prom/prometheus:v2.51.0
    container_name: devops-prometheus-dev
    restart: unless-stopped
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    ports:
      - "${PROMETHEUS_PORT}:9090"

  grafana:
    image: grafana/grafana:10.4.0
    container_name: devops-grafana-dev
    restart: unless-stopped
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD}
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana_data:/var/lib/grafana
    ports:
      - "${GRAFANA_PORT}:3000"
    depends_on:
      - prometheus
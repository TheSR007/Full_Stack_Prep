name: Multi-Tier Microservices CI/CD Pipeline

on:
  push:
    branches: [master, main]
  pull_request:
    types: [closed]
    branches: [master, main]

permissions:
  contents: write

jobs:
  filter:
    name: Detect Changed Services
    if: github.event_name == 'push' || (github.event_name == 'pull_request' && github.event.action == 'closed' && github.event.pull_request.merged == true)
    runs-on: ubuntu-latest
    outputs:
      frontend: ${{ steps.changes.outputs.frontend }}
      api-gateway: ${{ steps.changes.outputs.api-gateway }}
      api-go-user: ${{ steps.changes.outputs.api-go-user }}
      api-fastapi-worker: ${{ steps.changes.outputs.api-fastapi-worker }}
    steps:
      - name: Checkout Code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Check Service File Changes
        id: changes
        uses: dorny/paths-filter@v4
        with:
          filters: |
            frontend:
              - 'frontend-nextjs/**'
              - '.github/workflows/ci.yml'
            api-gateway:
              - 'api-gateway/**'
              - '.github/workflows/ci.yml'
            api-go-user:
              - 'api-go-user/**'
              - '.github/workflows/ci.yml'
            api-fastapi-worker:
              - 'api-fastapi-worker/**'
              - '.github/workflows/ci.yml'

  frontend-nextjs:
    name: Frontend Service Pipeline
    needs: filter
    if: needs.filter.outputs.frontend == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v7

      - name: Set Short SHA
        id: vars
        run: echo "short_sha=$(echo ${{ github.sha }} | cut -c1-7)" >> $GITHUB_OUTPUT

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "22"

      - name: Run Unit Tests
        run: |
          cd frontend-nextjs
          npm ci
          npm test

      - name: Lint Frontend
        run: |
          cd frontend-nextjs
          npm run lint

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build Local Image for Security Scan
        uses: docker/build-push-action@v7
        with:
          context: ./frontend-nextjs
          target: production
          load: true
          tags: local/frontend-nextjs:${{ steps.vars.outputs.short_sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Run Trivy Security Scan (Non-blocking)
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: "local/frontend-nextjs:${{ steps.vars.outputs.short_sha }}"
          format: "table"
          exit-code: "0"
          ignore-unfixed: true
          vuln-type: "os,library"
          severity: "CRITICAL"

      - name: Log in to Docker Hub
        if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Push Docker Image to Docker Hub
        if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
        uses: docker/build-push-action@v7
        with:
          context: ./frontend-nextjs
          target: production
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/fullstack-prep:frontend-nextjs-${{ steps.vars.outputs.short_sha }}
            ${{ secrets.DOCKERHUB_USERNAME }}/fullstack-prep:frontend-nextjs-latest
          cache-from: type=gha

  api-gateway:
    name: API Gateway Service Pipeline
    needs: filter
    if: needs.filter.outputs.api-gateway == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v7

      - name: Set Short SHA
        id: vars
        run: echo "short_sha=$(echo ${{ github.sha }} | cut -c1-7)" >> $GITHUB_OUTPUT

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: "1.25"
          cache-dependency-path: "**/go.sum"

      - name: Run Unit Tests
        run: |
          cd api-gateway
          go test -v ./...

      - name: Lint API Gateway (Go Vet)
        run: |
          cd api-gateway
          go vet ./...

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build Local Image for Security Scan
        uses: docker/build-push-action@v7
        with:
          context: ./api-gateway
          target: production
          load: true
          tags: local/api-gateway:${{ steps.vars.outputs.short_sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Run Trivy Security Scan (Critical Gate)
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: "local/api-gateway:${{ steps.vars.outputs.short_sha }}"
          format: "table"
          exit-code: "1"
          ignore-unfixed: true
          vuln-type: "os,library"
          severity: "CRITICAL"

      - name: Log in to Docker Hub
        if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Push Docker Image to Docker Hub
        if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
        uses: docker/build-push-action@v7
        with:
          context: ./api-gateway
          target: production
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/fullstack-prep:api-gateway-${{ steps.vars.outputs.short_sha }}
            ${{ secrets.DOCKERHUB_USERNAME }}/fullstack-prep:api-gateway-latest
          cache-from: type=gha

  api-go-user:
    name: Go User Service Pipeline
    needs: filter
    if: needs.filter.outputs.api-go-user == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v7

      - name: Set Short SHA
        id: vars
        run: echo "short_sha=$(echo ${{ github.sha }} | cut -c1-7)" >> $GITHUB_OUTPUT

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: "1.25"
          cache-dependency-path: "**/go.sum"

      - name: Run Unit Tests
        run: |
          cd api-go-user
          go test -v ./...

      - name: Lint Go User Service (Go Vet)
        run: |
          cd api-go-user
          go vet ./...

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build Local Image for Security Scan
        uses: docker/build-push-action@v7
        with:
          context: ./api-go-user
          target: production
          load: true
          tags: local/api-go-user:${{ steps.vars.outputs.short_sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Run Trivy Security Scan (Critical Gate)
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: "local/api-go-user:${{ steps.vars.outputs.short_sha }}"
          format: "table"
          exit-code: "1"
          ignore-unfixed: true
          vuln-type: "os,library"
          severity: "CRITICAL"

      - name: Log in to Docker Hub
        if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Push Docker Image to Docker Hub
        if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
        uses: docker/build-push-action@v7
        with:
          context: ./api-go-user
          target: production
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/fullstack-prep:api-go-user-${{ steps.vars.outputs.short_sha }}
            ${{ secrets.DOCKERHUB_USERNAME }}/fullstack-prep:api-go-user-latest
          cache-from: type=gha

  api-fastapi-worker:
    name: FastAPI Worker Service Pipeline
    needs: filter
    if: needs.filter.outputs.api-fastapi-worker == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v7

      - name: Set Short SHA
        id: vars
        run: echo "short_sha=$(echo ${{ github.sha }} | cut -c1-7)" >> $GITHUB_OUTPUT

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - name: Run Unit Tests
        run: |
          cd api-fastapi-worker
          pip install -r requirements.txt
          python -m pytest

      - name: Lint FastAPI Worker (Flake8)
        run: |
          cd api-fastapi-worker
          pip install flake8
          flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build Local Image for Security Scan
        uses: docker/build-push-action@v7
        with:
          context: ./api-fastapi-worker
          target: production
          load: true
          tags: local/api-fastapi-worker:${{ steps.vars.outputs.short_sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Run Trivy Security Scan (Critical Gate)
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: "local/api-fastapi-worker:${{ steps.vars.outputs.short_sha }}"
          format: "table"
          exit-code: "1"
          ignore-unfixed: true
          vuln-type: "os,library"
          severity: "CRITICAL"

      - name: Log in to Docker Hub
        if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Push Docker Image to Docker Hub
        if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
        uses: docker/build-push-action@v7
        with:
          context: ./api-fastapi-worker
          target: production
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/fullstack-prep:api-fastapi-worker-${{ steps.vars.outputs.short_sha }}
            ${{ secrets.DOCKERHUB_USERNAME }}/fullstack-prep:api-fastapi-worker-latest
          cache-from: type=gha

  update-compose-tags:
    name: Update Compose Tags ([skip ci])
    needs:
      - filter
      - frontend-nextjs
      - api-gateway
      - api-go-user
      - api-fastapi-worker
    if: |
      always() && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master') &&
      (
        (needs.filter.outputs.frontend          == 'true' && needs.frontend-nextjs.result    == 'success') ||
        (needs.filter.outputs.api-gateway       == 'true' && needs.api-gateway.result        == 'success') ||
        (needs.filter.outputs.api-go-user       == 'true' && needs.api-go-user.result        == 'success') ||
        (needs.filter.outputs.api-fastapi-worker == 'true' && needs.api-fastapi-worker.result == 'success')
      )
    runs-on: ubuntu-latest
    steps:
      - name: Determine Token
        id: token
        run: |
          if [ -n "${{ secrets.BUMP_TOKEN }}" ]; then
            echo "token=BUMP_TOKEN" >> "$GITHUB_OUTPUT"
          else
            echo "token=GITHUB_TOKEN" >> "$GITHUB_OUTPUT"
          fi

      - name: Checkout Code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          token: ${{ steps.token.outputs.token == 'BUMP_TOKEN' && secrets.BUMP_TOKEN || secrets.GITHUB_TOKEN }}

      - name: Update Image Tags in Compose File
        run: |
          SHORT_SHA=$(echo "${{ github.sha }}" | cut -c1-7)

          if [ "${{ needs.filter.outputs.frontend }}" = 'true' ] && [ "${{ needs.frontend-nextjs.result }}" = 'success' ]; then
            sed -i -E "s|(:frontend-nextjs-).*|\1${SHORT_SHA}|g" docker-compose.yml
          fi

          if [ "${{ needs.filter.outputs.api-gateway }}" = 'true' ] && [ "${{ needs.api-gateway.result }}" = 'success' ]; then
            sed -i -E "s|(:api-gateway-).*|\1${SHORT_SHA}|g" docker-compose.yml
          fi

          if [ "${{ needs.filter.outputs.api-go-user }}" = 'true' ] && [ "${{ needs.api-go-user.result }}" = 'success' ]; then
            sed -i -E "s|(:api-go-user-).*|\1${SHORT_SHA}|g" docker-compose.yml
          fi

          if [ "${{ needs.filter.outputs.api-fastapi-worker }}" = 'true' ] && [ "${{ needs.api-fastapi-worker.result }}" = 'success' ]; then
            sed -i -E "s|(:api-fastapi-worker-).*|\1${SHORT_SHA}|g" docker-compose.yml
          fi

      - name: Commit and Push Compose Tag Update ([skip ci])
        run: |
          TOKEN="${{ steps.token.outputs.token == 'BUMP_TOKEN' && secrets.BUMP_TOKEN || secrets.GITHUB_TOKEN }}"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docker-compose.yml
          if ! git diff --quiet HEAD; then
            git commit -m "ci: update docker compose image tags [skip ci]"
            git remote set-url origin "https://x-access-token:${TOKEN}@github.com/${{ github.repository }}.git"
            git push origin HEAD:${{ github.ref_name }}
          else
            echo "No changes to commit."
          fi

      - name: Trigger doco-cd Deployment Webhook
        run: |
          if [ -n "${{ secrets.DOCO_CD_SERVER_URL }}" ]; then
            echo "Sending deployment trigger to doco-cd server..."
            BODY='{"ref":"refs/heads/'${{ github.ref_name }}'","repository":{"full_name":"'${{ github.repository }}'"}}'
            if [ -n "${{ secrets.WEBHOOK_SECRET }}" ]; then
              SIG=$(echo -n "$BODY" | openssl dgst -sha256 -hmac "${{ secrets.WEBHOOK_SECRET }}" | sed 's/(stdin)= //')
              curl -s -X POST "${{ secrets.DOCO_CD_SERVER_URL }}" \
                -H "Content-Type: application/json" \
                -H "X-Hub-Signature-256: sha256=${SIG}" \
                -d "$BODY" || echo "Webhook trigger sent."
            else
              curl -s -X POST "${{ secrets.DOCO_CD_SERVER_URL }}" \
                -H "Content-Type: application/json" \
                -d "$BODY" || echo "Webhook trigger sent."
            fi
          else
            echo "DOCO_CD_SERVER_URL secret not set. Skipping Webhook trigger."
          fi
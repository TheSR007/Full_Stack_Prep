<header class="sticky top-0 z-30 glass-panel border-b border-slate-200/80 dark:border-slate-800/80 transition-colors duration-200">
  <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 h-16 flex items-center justify-between gap-3">
    
    <!-- Brand Logo & Desktop Nav Pills -->
    <div class="flex items-center gap-6">
      <a href="/" hx-get="/" hx-target="#main-content" hx-push-url="true" class="flex items-center gap-2.5 group shrink-0">
        <div class="w-9 h-9 rounded-xl bg-gradient-to-tr from-indigo-600 via-indigo-500 to-violet-500 flex items-center justify-center text-white font-extrabold text-sm shadow-md shadow-indigo-500/20 group-hover:scale-105 transition-transform">
          TM
        </div>
        <span class="font-extrabold text-lg tracking-tight bg-gradient-to-r from-slate-900 via-slate-800 to-indigo-900 dark:from-white dark:via-slate-100 dark:to-indigo-200 bg-clip-text text-transparent">
          TaskFlow
        </span>
      </a>

      <!-- Primary Desktop Navigation Pills (>= 768px) -->
      <nav id="main-nav" class="hidden md:flex items-center bg-slate-100/80 dark:bg-slate-950/80 p-1 rounded-xl border border-slate-200/80 dark:border-slate-800/80">
        <!-- Board -->
        <a
          href="/"
          hx-get="/"
          hx-target="#main-content"
          hx-push-url="true"
          data-nav="board"
          class="flex items-center gap-1.5 px-3.5 py-1.5 rounded-lg text-xs transition-all {% if active_view == 'kanban' %}bg-indigo-600 text-white shadow-md shadow-indigo-500/25 font-bold{% else %}text-slate-600 dark:text-slate-400 hover:text-slate-900 dark:hover:text-slate-200 hover:bg-slate-200/50 dark:hover:bg-slate-800/50 font-semibold{% endif %}"
        >
          <i data-lucide="layout-grid" class="w-3.5 h-3.5"></i>
          Board
        </a>

        <!-- List -->
        <a
          href="/tasks"
          hx-get="/tasks"
          hx-target="#main-content"
          hx-push-url="true"
          data-nav="list"
          class="flex items-center gap-1.5 px-3.5 py-1.5 rounded-lg text-xs transition-all {% if active_view == 'list' %}bg-indigo-600 text-white shadow-md shadow-indigo-500/25 font-bold{% else %}text-slate-600 dark:text-slate-400 hover:text-slate-900 dark:hover:text-slate-200 hover:bg-slate-200/50 dark:hover:bg-slate-800/50 font-semibold{% endif %}"
        >
          <i data-lucide="list" class="w-3.5 h-3.5"></i>
          List
        </a>

        <!-- Analytics -->
        <a
          href="/analytics"
          hx-get="/analytics"
          hx-target="#main-content"
          hx-push-url="true"
          data-nav="analytics"
          class="flex items-center gap-1.5 px-3.5 py-1.5 rounded-lg text-xs transition-all {% if active_view == 'analytics' %}bg-indigo-600 text-white shadow-md shadow-indigo-500/25 font-bold{% else %}text-slate-600 dark:text-slate-400 hover:text-slate-900 dark:hover:text-slate-200 hover:bg-slate-200/50 dark:hover:bg-slate-800/50 font-semibold{% endif %}"
        >
          <i data-lucide="bar-chart-3" class="w-3.5 h-3.5"></i>
          Analytics
        </a>

        <!-- Settings -->
        <a
          href="/settings"
          hx-get="/settings"
          hx-target="#main-content"
          hx-push-url="true"
          data-nav="settings"
          class="flex items-center gap-1.5 px-3.5 py-1.5 rounded-lg text-xs transition-all {% if active_view == 'settings' %}bg-indigo-600 text-white shadow-md shadow-indigo-500/25 font-bold{% else %}text-slate-600 dark:text-slate-400 hover:text-slate-900 dark:hover:text-slate-200 hover:bg-slate-200/50 dark:hover:bg-slate-800/50 font-semibold{% endif %}"
        >
          <i data-lucide="settings" class="w-3.5 h-3.5"></i>
          Settings
        </a>
      </nav>
    </div>

    <!-- Active Search & Action Controls -->
    <div class="flex items-center gap-2 sm:gap-3">
      <!-- Search Input (Responsive Width) -->
      <div class="relative w-32 sm:w-56">
        <div class="absolute inset-y-0 left-0 pl-2.5 flex items-center pointer-events-none text-slate-400">
          <i data-lucide="search" class="w-3.5 h-3.5"></i>
        </div>
        <input
          type="search"
          name="search"
          value="{{ current_search or '' }}"
          placeholder="Search..."
          hx-get="/tasks"
          hx-trigger="keyup delay:300ms, search"
          hx-target="#main-content"
          hx-push-url="true"
          class="w-full pl-8 pr-2.5 py-1.5 bg-slate-100/90 dark:bg-slate-950/90 border border-slate-200/80 dark:border-slate-800/80 rounded-xl text-xs text-slate-900 dark:text-slate-100 placeholder-slate-400 focus:ring-2 focus:ring-indigo-500/50 focus:border-indigo-500 outline-none transition-all"
        >
      </div>

      <!-- Theme Toggle Button -->
      <button
        onclick="window.toggleTheme()"
        type="button"
        aria-label="Toggle theme"
        class="p-2 rounded-xl border border-slate-200/80 dark:border-slate-800/80 text-slate-600 dark:text-slate-300 hover:bg-slate-100 dark:hover:bg-slate-800/60 transition-colors shrink-0"
      >
        <i data-lucide="sun" class="w-4 h-4 hidden dark:block text-amber-400"></i>
        <i data-lucide="moon" class="w-4 h-4 block dark:hidden text-indigo-600"></i>
      </button>

      <!-- Primary CTA "+ New Task" Button -->
      <button
        hx-get="/tasks/new"
        hx-target="#modal-container"
        class="flex items-center gap-1.5 px-3 sm:px-3.5 py-1.5 rounded-xl bg-gradient-to-r from-indigo-600 to-violet-600 hover:from-indigo-500 hover:to-violet-500 text-white font-semibold text-xs shadow-md shadow-indigo-500/20 active:scale-95 transition-all shrink-0"
      >
        <i data-lucide="plus" class="w-3.5 h-3.5"></i>
        <span class="hidden sm:inline">New Task</span>
      </button>
    </div>
  </div>
</header>

<!-- Fixed Mobile Bottom Navigation Bar (< 768px md Breakpoint) -->
<nav id="mobile-nav" class="md:hidden fixed bottom-0 left-0 right-0 z-40 glass-panel border-t border-slate-200/80 dark:border-slate-800/80 px-2 py-1.5 flex items-center justify-around shadow-2xl">
  <a
    href="/"
    hx-get="/"
    hx-target="#main-content"
    hx-push-url="true"
    data-nav="board"
    class="flex flex-col items-center gap-1 px-3 py-1 rounded-xl text-[10px] font-semibold text-slate-600 dark:text-slate-400 transition-all"
  >
    <i data-lucide="layout-grid" class="w-4 h-4"></i>
    <span>Board</span>
  </a>

  <a
    href="/tasks"
    hx-get="/tasks"
    hx-target="#main-content"
    hx-push-url="true"
    data-nav="list"
    class="flex flex-col items-center gap-1 px-3 py-1 rounded-xl text-[10px] font-semibold text-slate-600 dark:text-slate-400 transition-all"
  >
    <i data-lucide="list" class="w-4 h-4"></i>
    <span>List</span>
  </a>

  <a
    href="/analytics"
    hx-get="/analytics"
    hx-target="#main-content"
    hx-push-url="true"
    data-nav="analytics"
    class="flex flex-col items-center gap-1 px-3 py-1 rounded-xl text-[10px] font-semibold text-slate-600 dark:text-slate-400 transition-all"
  >
    <i data-lucide="bar-chart-3" class="w-4 h-4"></i>
    <span>Analytics</span>
  </a>

  <a
    href="/settings"
    hx-get="/settings"
    hx-target="#main-content"
    hx-push-url="true"
    data-nav="settings"
    class="flex flex-col items-center gap-1 px-3 py-1 rounded-xl text-[10px] font-semibold text-slate-600 dark:text-slate-400 transition-all"
  >
    <i data-lucide="settings" class="w-4 h-4"></i>
    <span>Settings</span>
  </a>
</nav>

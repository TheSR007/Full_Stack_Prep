<!DOCTYPE html>
<html lang="en" class="h-full">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="icon" type="image/svg+xml" href="/static/favicon.svg" />
  <title>TaskFlow — HTMX Task Manager</title>
  
  <!-- Inline FOUC theme initialization -->
  <script>
    if (localStorage.getItem('taskflow-theme') === 'dark' || (!('taskflow-theme' in localStorage) && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
      document.documentElement.classList.add('dark');
    } else {
      document.documentElement.classList.remove('dark');
    }
  </script>

  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          fontFamily: {
            sans: ['Inter', '-apple-system', 'BlinkMacSystemFont', 'Segoe UI', 'Roboto', 'sans-serif'],
            mono: ['Fira Code', 'ui-monospace', 'monospace'],
          }
        }
      }
    }
  </script>

  <!-- HTMX 2.0 Library -->
  <script src="https://unpkg.com/htmx.org@2.0.0/dist/htmx.min.js"></script>

  <!-- SortableJS for Drag and Drop -->
  <script src="https://cdn.jsdelivr.net/npm/sortablejs@1.15.0/Sortable.min.js"></script>

  <!-- Lucide Icons CDN -->
  <script src="https://unpkg.com/lucide@latest"></script>

  <!-- Custom Design Token Styles -->
  <link rel="stylesheet" href="/static/css/styles.css">

  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fira+Code:wght@400;500;600&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
</head>
<body class="h-full bg-slate-50 dark:bg-slate-950 text-slate-900 dark:text-slate-100 antialiased selection:bg-indigo-500 selection:text-white transition-colors duration-200">
  
  <div class="min-h-full flex flex-col">
    <!-- Header Component -->
    {% include "components/header.html" %}

    <!-- Main View Content Area -->
    <main id="main-content" class="flex-1 max-w-7xl w-full mx-auto px-4 sm:px-6 lg:px-8 pt-4 pb-24 md:pb-8">
      {% if content_template %}
        {% include content_template %}
      {% else %}
        {% block content %}
        {% endblock %}
      {% endif %}
    </main>
  </div>

  <!-- Modal Portal Overlay Container -->
  <div id="modal-container"></div>

  <!-- Global Toast Notification Layer -->
  <div id="toast-container" class="fixed bottom-16 sm:bottom-5 right-5 z-50 flex flex-col gap-2 max-w-md w-full pointer-events-none"></div>

  <!-- Dynamic Navigation Highlight, Lucide & Theme Script -->
  <script src="/static/js/theme.js"></script>
  <script>
    function initAppUI() {
      // Initialize Lucide Icons
      if (window.lucide && typeof window.lucide.createIcons === 'function') {
        window.lucide.createIcons();
      }

      // Update Desktop & Mobile Navigation Active Links
      const path = window.location.pathname;

      function updateNavContainer(containerId, activeClass, inactiveClass) {
        const nav = document.getElementById(containerId);
        if (!nav) return;
        const links = nav.querySelectorAll('a[data-nav]');
        links.forEach(link => {
          const targetNav = link.getAttribute('data-nav');
          let isMatch = false;

          if (targetNav === 'board' && (path === '/' || path === '')) {
            isMatch = true;
          } else if (targetNav === 'list' && path.startsWith('/tasks') && !path.includes('/tasks/task-')) {
            isMatch = true;
          } else if (targetNav === 'analytics' && path.startsWith('/analytics')) {
            isMatch = true;
          } else if (targetNav === 'settings' && path.startsWith('/settings')) {
            isMatch = true;
          }

          link.className = isMatch ? activeClass : inactiveClass;
        });
      }

      // Desktop Nav
      updateNavContainer(
        'main-nav',
        'flex items-center gap-1.5 px-3.5 py-1.5 rounded-lg text-xs font-bold transition-all bg-indigo-600 text-white shadow-md shadow-indigo-500/25',
        'flex items-center gap-1.5 px-3.5 py-1.5 rounded-lg text-xs font-semibold transition-all text-slate-600 dark:text-slate-400 hover:text-slate-900 dark:hover:text-slate-200 hover:bg-slate-200/50 dark:hover:bg-slate-800/50'
      );

      // Mobile Nav
      updateNavContainer(
        'mobile-nav',
        'flex flex-col items-center gap-1 px-3.5 py-1 rounded-xl text-[10px] font-bold text-indigo-600 dark:text-indigo-400 bg-indigo-50 dark:bg-slate-800/80 shadow-xs',
        'flex flex-col items-center gap-1 px-3.5 py-1 rounded-xl text-[10px] font-semibold text-slate-500 dark:text-slate-400 hover:text-slate-900 dark:hover:text-slate-200'
      );
    }

    document.addEventListener('DOMContentLoaded', initAppUI);
    document.addEventListener('htmx:afterSettle', initAppUI);
    window.addEventListener('popstate', initAppUI);
  </script>
</body>
</html>
